# Workflow simples para implantar conteúdo estático no GitHub Pages
name: Deploy static content to Pages

on:
  # Executa em todo push para a branch principal (main)
  push:
    branches: ["main"]
  # Permite executar este workflow manualmente na aba Actions
  workflow_dispatch:

# Configura as permissões do GITHUB_TOKEN para permitir o envio ao GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas uma implantação simultânea por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job único de implantação
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate public site
        run: |
          npm run build
          npm run check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Envia apenas o artefato público validado
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
